# ============================================================
# DomainEnum — CLASSIFICATION: which area of expertise (CLS-001 / E027)
# ============================================================
# `domain` is mandatory (1..1) on every object type. It is ORTHOGONAL to
# taxonomy_path: the taxonomy says WHERE in the subject tree the object sits,
# the domain says WHICH expertise is needed to judge it. Do not mirror the
# taxonomy here.
domains:
  # --- Duckburg Vibe Inc platform & infrastructure domains ---
  - distributed_systems   # cluster architecture, worker topology, consensus
  - data_pipelines        # event streaming, pub/sub, message routing
  - data_processing       # compute engines, stream transformations, batch workers
  - api_protocols         # gRPC, RPC schemas, API gateways, REST, GraphQL
  - storage_state         # databases, distributed cache, state replication
  - runtime_frameworks    # async runtimes, event loops, concurrency, IPC
  - configuration         # dynamic config, feature flags, service discovery
  - observability         # OpenTelemetry tracing, Prometheus metrics, logging
  - reliability           # circuit breakers, failover, disaster recovery, HA
  - performance           # latency tuning, throughput, profiling, capacity
  - security              # secure coding, IAM, encryption, threat modeling, CVEs
  - networking_edge       # edge proxies, CDN, ingress, TLS termination
  - cloud_infrastructure  # multi-cloud integrations, Kubernetes, cluster infrastructure

  # --- software engineering domains ---
  - software_engineering  # general design and implementation practice
  - build_systems         # build, link, package, toolchain
  - verification          # test, mocking, QA and coverage engineering
  - devops                # CI/CD pipelines, GitOps, gating, release automation
  - ai_engineering        # AI-assisted engineering practice and internal agent tooling
  - engineering_process   # ways of working, ADRs, RFC processes, review policy

  # --- broad discipline domains (used by both scopes) ---
  # Deliberately COARSER than the taxonomy and NOT a 1:1 image of it (CLS-002).
  # Several of these serve nodes in both scopes, e.g. `management` covers
  # TX-PERS-09 and TX-ENG-15; `software_engineering` covers TX-PERS-07-03 and
  # several engineering nodes; `security` covers TX-PERS-07-02 and TX-ENG-16.
  - formal_science        # logic, philosophy of science, mathematics
  - natural_science
  - human_science         # psychology, cognition
  - social_science        # society, economics, politics, history, culture
  - computer_science
  - engineering
  - management
  - practical_skills