# object_registry.yaml
# Canonical source of truth for the CLASSIFICATION axis (ID-002, ID-005, FAC-001,
# CLS-001). Holds both value sets of the CLASSIFICATION metadata category:
#   object_types:  WHAT KIND of knowledge object it is
#   domains:       WHICH area of expertise it belongs to
#
# Facet VALUE sets live in facet_registry.yaml; this file only declares WHICH
# facets are mandatory per object type (required_facets).
#
# FIELD CONTRACT per object type
#   code            : TYPE_CODE used in the ID (ID-002); MUST be unique
#   category        : information | semantic | domain | events | procedural
#   allowed_scopes  : scopes the type may be used in (ID-005 / E006)
#   required_facets : facets that MUST be present (FAC-001 / E020)
#   tag_strategy    : domain -> DOMAIN_TAG_PATTERN, year -> YEAR_TAG_PATTERN (ID-003)

schema_version: "1.0.0"

object_types:
  Article:
    code: ART
    category: information
    allowed_scopes: [personal, engineering]
    required_facets: [language, audience]
    tag_strategy: domain
