  # --- families added 2026-09-07 (D98) ---
  # VALIDATION.md §10.5 requires exactly one owner per invariant family and
  # CONFORM-001 requires that ownership be centrally checkable through this
  # file. The families below were referenced by invariants in the locked core
  # but had no record here, so the projection was incomplete.
  - family_id: RET
    owner: specs/RETRIEVAL.md
  - family_id: META
    owner: specs/ARCHITECTURE.md
  - family_id: LIB
    owner: specs/ARCHITECTURE.md
  - family_id: SCOPE
    owner: specs/DATA_MODEL.md
  # VAL-001 (temporal validity: valid_until MUST NOT precede valid_from) is
  # defined in EPISTEMOLOGY.md §Provenance Validation Rules and restated in
  # VALIDATION.md §11 (E007). VAL-011..014 (link mirroring, mermaid degradation,
  # non-neural verifier, runaway-loop fence) are defined in VALIDATION.md §10.6.
  # VALIDATION.md §11 is the consolidated invariant table and owns the family.
  - family_id: VAL
    owner: specs/VALIDATION.md
  - family_id: ERR
    owner: specs/VALIDATION.md
  - family_id: FS
    owner: specs/VALIDATION.md
  - family_id: G
    owner: specs/INGEST-PIPELINE.md
  # --- families added 2026-09-09 (pending invariants, implementation in progress) ---
  # RET-010/011 (section-targeted retrieval + RCVA), SCHEMA-005 (Document Card),
  # VAL-011..014 (link mirroring, mermaid degradation, non-neural verifier,
  # runaway-loop fence), REVIEW-011 (moderator pre-scoring) and DISC-009
  # (delimited instruction fence) were codified 2026-09-08 and are tracked as
  # their own families until runtime implementation + tests land. This keeps the
  # conformance projection from over-reporting families whose newer invariants
  # are not yet implemented (VALIDATION.md §10.5, CONFORM-001).
  - family_id: RET-RCVA
    owner: specs/RETRIEVAL.md
  - family_id: SCHEMA-CARD
    owner: specs/SCHEMA.md
  - family_id: VAL-EXT
    owner: specs/VALIDATION.md
  - family_id: REVIEW-MOD
    owner: specs/REVIEW-PROMOTION.md
  - family_id: DISC-FENCE
    owner: specs/DISCOVERY.md

validation:
  duplicate_family_owners: error
  unknown_owner_paths: error
  invariant_ids_require_owner: error
  conformance_evidence_fields: [owner, invariant_id, implementation, test, verification]
  runtime_and_tests: planned
