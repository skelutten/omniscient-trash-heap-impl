# source_registry.yaml
# Normative source classification registry for the Universal Source Model.
# Owns SOURCE-001..SOURCE-020 and source-type contracts.
# RAW-001..RAW-010 are owned by INGEST-STAGING.md; this registry carries the
# machine-readable raw-storage projection only.
# Does not own Knowledge Objects, actors, taxonomy, or security policy.

schema_version: "0.2.0"
registry_id: source_registry
description: >-
  Canonical classification of captured information-bearing artifacts, events,
  and experiences entering the Knowledge Compiler. Source type is orthogonal to
  object_type, taxonomy, facets, relations, actors, and epistemic status.

categories:
  Artifact:
    description: Durable, addressable representation or record.
    required_fields: [representation]
    identity_requirement: >-
      At least one identity alternative MUST be present: resource URI/path,
      external identity, or content hash.
    recommended_fields: [title, author_ref, captured_at, content_hash, media_type]
  Event:
    description: Time-bound occurrence or interaction.
    required_fields: [occurred_at]
    recommended_fields: [actor_refs, participants, duration, location]
    actor_rule: >-
      actor_refs SHOULD be present; they become REQUIRED where the external
      source provides actor identity or where the event is not independently
      identifiable without an actor.
  Experience:
    description: Actor-bound cognitive, subjective, or reflective capture.
    required_fields: [experienced_at, actor_ref]
    recommended_fields: [content_hash, related_source_refs, context]

# Source taxonomy is a source-classification projection, not the Knowledge
# taxonomy. It may be used for adapter routing and discovery weighting only.
source_taxonomy:
  Digital:
    children: [Web, Documentation, Communication, Calendar, Code, Data, Media]
  Personal:
    children: [Note, Thought, Question, Reflection]
  Operational:
    children: [Runtime, Delivery, Experiment]
  Organizational:
    # Documentation is also reachable from Digital; this source taxonomy is
    # a routing projection and may have shared leaf names.
    children: [Meeting, Training, DecisionRecord, Documentation]

# source_type is the stable intrinsic type. medium and semantic_kind are
# orthogonal dimensions: e.g. a web representation may contain an article,
# and an email artifact may carry transmission metadata.
source_types:
  # Artifact: external and internal durable representations
  web_resource:
    category: Artifact
    source_taxonomy: [Digital, Web]
    medium: web
    semantic_kinds: [article, news, document, forum_post, forum_thread, specification]
    identity_fields_any_of: [[canonical_uri, representation_hash], [canonical_uri, observed_at]]
    provenance_requirements: [canonical_uri, retrieved_at, representation_hash]
    recommended_fields: [published_at, modified_at, author_ref, publisher_ref, content_snapshot, media_type]
  internal_document:
    category: Artifact
    source_taxonomy: [Digital, Documentation]
    medium: internal_system
    semantic_kinds: [document, specification, article, wiki_page]
    identity_fields_any_of: [[source_system, external_id, representation_hash], [repository_uri, path, revision, representation_hash]]
    provenance_requirements: [source_system, external_id, access_scope, representation_hash]
    recommended_fields: [workspace, space, repository, path, revision, owner_ref, last_modified]
  book:
    category: Artifact
    source_taxonomy: [Digital, Media]
    medium: file_or_print
    semantic_kinds: [book, monograph]
    identity_fields_any_of: [[isbn_or_catalog_id, edition], [title, author_ref, edition, representation_hash]]
    provenance_requirements: [title, representation_hash]
    recommended_fields: [publisher, publication_year, language, page_or_location]
  document:
    category: Artifact
    source_taxonomy: [Digital, Documentation]
    medium: file
    semantic_kinds: [document, report, article, notes]
    identity_fields_any_of: [[resource, representation_hash], [content_hash]]
    provenance_requirements: [resource, representation_hash]
  forum_post:
    category: Artifact
    source_taxonomy: [Digital, Web]
    medium: web
    semantic_kinds: [forum_post]
    identity_fields_any_of: [[source_system, external_id], [canonical_uri, representation_hash]]
    provenance_requirements: [source_system, external_id, representation_hash]
  code_repository:
    category: Artifact
    source_taxonomy: [Digital, Code]
    medium: git_or_filesystem
    semantic_kinds: [code, repository, build_file, patch, diff]
    identity_fields_any_of: [[repository_uri, revision_or_commit], [resource, representation_hash]]
    provenance_requirements: [repository_uri, revision_or_commit, representation_hash]
  specification:
    category: Artifact
    source_taxonomy: [Digital, Documentation]
    medium: file_or_web
    semantic_kinds: [specification, standard, rfc, openapi_spec, asyncapi_spec, vendor_icd, ietf_draft]
    identity_fields_any_of: [[canonical_uri, representation_hash], [standard_id, edition, representation_hash]]
    provenance_requirements: [representation_hash]
  diagram_or_image:
