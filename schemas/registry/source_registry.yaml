lifecycle:
  # `deleted` is a logical lifecycle state. Immutable raw bytes and audit
  # manifests are retained according to the storage/retention policy; this
  # registry state MUST NOT be interpreted as permission to overwrite raw data.
  states: [captured, normalized, interpreted, verified, superseded, retracted, expired, deleted]
  initial_state: captured
  immutable_representation: true
  transitions:
    captured: [normalized, retracted, deleted]
    normalized: [interpreted, superseded, retracted, expired]
    interpreted: [verified, superseded, retracted, expired]
    verified: [superseded, retracted, expired]
    superseded: []
    retracted: []
    expired: []
    deleted: []

# Re-ingestion is an operation, never a source type.
ingest_modes: [create, update, migrate, reingest, reindex]

legacy_source_type_map:
  web_page: web_resource
  web_article: web_resource
  internal_spec: internal_document
  system_doc: internal_document
  vendor_doc: specification
  api_spec: specification
  rfc: specification
  standard: specification
  conversation: conversation_capture
  slack_message: conversation_capture
  teams_message: conversation_capture
  meeting_notes: meeting_notes
  post_mortem: document
  observation: observation
  personal_note: note
  email: email_message
  book: book
  code: code_repository

invariants:
  SOURCE-001: Every captured input MUST enter through the Universal Source Model.
  SOURCE-002: Source type, object type, taxonomy, facets, relations, actors and epistemic status MUST remain separate namespaces.
  SOURCE-003: Agent trajectories MUST be one specialized source type, never the universal ingestion abstraction.
  SOURCE-004: Capture MUST be possible before canonical classification.
  SOURCE-005: Discovery MAY derive Knowledge Objects but MUST NOT mutate a Source into one.
  SOURCE-006: Every canonical Knowledge Object MUST retain provenance to one or more Sources.
  SOURCE-007: Source identity and representation identity MUST be distinguishable.
  SOURCE-008: Representations MUST be immutable; changed content creates a new representation.
  SOURCE-009: Unknown source types, category mismatches, missing identity or missing provenance MUST fail closed.
  SOURCE-010: Personal thoughts, ideas, questions and hypotheses MUST NOT automatically become verified evidence.
  SOURCE-011: Connectors acquire; adapters normalize; ingestion validates; discovery proposes; governance promotes.
  SOURCE-012: Source access and privacy constraints MUST propagate according to governance policy.
  SOURCE-013: Re-ingestion of canonical objects is an ingest mode, not a source type.
  SOURCE-014: A common envelope MAY contain a typed payload; universal ingestion MUST NOT flatten source-specific data.
  SOURCE-015: Artifact identity MUST use a resource/external identity or content hash; Event identity MUST include occurrence context; Experience identity MUST include actor, time and content identity.
  SOURCE-016: A representation MAY carry event metadata or represent an Event; this MUST NOT change its intrinsic source category.
  SOURCE-017: Source classification MUST NOT replace Knowledge taxonomy or object classification.
  SOURCE-018: A source MAY contribute to multiple derived objects and a canonical object MAY cite multiple source representations.
  SOURCE-019: Source identity deduplication, representation deduplication, semantic duplicate detection and Knowledge duplicate detection are separate decisions.
  SOURCE-020: Raw representations MUST be lossless and append-only; normalization MUST retain a reference to the raw representation.

# These are architecture-level contracts, not runtime implementations.
raw_storage:
  invariant_range: [RAW-001, RAW-010]
  rule: Captured representations MUST NOT be modified in place.
  logical_layout: raw/sources/<source_id>/representations/<representation_id>/
  source_metadata: source.yaml
  representation_metadata: metadata.yaml
  manifests: raw/manifests/
  content_store:
    mode: optional_content_addressable
    object_layout: raw/objects/sha256/<prefix>/<sha256>
    identity_field: content_hash
    deduplicates_bytes_only: true
  large_binary_policy: Metadata MAY remain in the repository while content is stored in filesystem, LFS or external blob storage.
  derived_storage:
    staging: staging/
    canonical_knowledge: existing_personal_and_engineering_trees
  retention_owner: governance_policy
  raw_mutation: forbidden
