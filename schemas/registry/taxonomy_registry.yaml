# taxonomy_registry.yaml
# Canonical source of truth for the taxonomy (TAX-001–TAX-008).
# Nodes form a forest of directed trees per scope, without cycles.
#
# AXIS DISCIPLINE (ARCHITECTURE.md §1.1)
#   This registry answers ONLY "what subject is this about".
#     - What KIND of thing a page is        -> object_type   (object_registry.yaml)
#     - What STATE it is in                 -> facets.lifecycle (facet_registry.yaml)
#     - Who it is FOR                       -> facets.audience  (facet_registry.yaml)
#     - Which tool/platform/language        -> facets           (facet_registry.yaml)
#     - How it CONNECTS to other objects    -> relations        (relation_registry.yaml)
#   Consequently there are deliberately NO nodes for "troubleshooting",
#   "standards", "tools", "references", "plans", "features" or "roadmap" —
#   those are object types, facets or relations, not subjects.
#
# FIELD CONTRACT
#   taxonomy_id : globally unique (W010 on duplicate)
#   name        : flat leaf-name; equals the frontmatter field taxonomy_path (TAX-007)
#   scope       : personal | engineering
#   parent_id   : null for a root node, else an existing node in the SAME scope (TAX-005)
#   description : OPTIONAL documentation and boundary guard. Documentation only —
#                 it MUST NOT affect path computation (TAX-008).
#
# SCOPE RULE (ARCHITECTURE.md §8.2)
#   Knowledge that survives leaving this organisation -> scope: personal.
#   Knowledge that depends on Duckburg Vibe Inc systems, toolchains or org -> scope: engineering.

