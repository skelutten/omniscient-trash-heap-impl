[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trashheap"
version = "3.8.10"
description = "The Omniscient Trash Heap: deterministic knowledge compiler, linter, and retrieval system"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "The Omniscient Trash Heap Maintainers" }
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
parquet = [
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
trashheap = "trashheap.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "trashheap/schemas"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "specs",
    "schemas",
    "research",
    "plans",
    "external-specs",
    "fixtures",
    ".agents",
    "input-artifacts",
    "review-outputs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["trashheap"]
omit = ["trashheap/operations/pubmed_benchmark.py"]

[tool.coverage.report]
precision = 1
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
